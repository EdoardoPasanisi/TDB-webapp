<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tenuta del Barone</title>
    <!--
      Pagina di riserva inclusa nell'app (server.errorPath in capacitor.config.ts):
      compare quando app.tenutadelbarone.com non si carica (niente rete, server giù).
      "Riprova" torna al sito; quando la rete torna ci riprova anche da sola.
    -->
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #060807;
        color: #f4f4f2;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .wrap {
        min-height: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        text-align: center;
      }
      h1 { font-size: 20px; font-weight: 600; margin: 0; }
      p { margin: 0; opacity: 0.7; font-size: 15px; line-height: 1.5; max-width: 320px; }
      button {
        margin-top: 8px;
        min-width: 200px;
        padding: 14px 24px;
        border: 0;
        border-radius: 14px;
        background: #f4f4f2;
        color: #060807;
        font-size: 16px;
        font-weight: 600;
      }
      button:active { opacity: 0.8; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Tenuta del Barone</h1>
      <p>Non riusciamo a caricare l’app in questo momento.<br />Controlla la connessione a internet e riprova.</p>
      <button type="button" id="retry">Riprova</button>
    </div>
    <script>
      (function () {
        var APP_URL = 'https://app.tenutadelbarone.com/';
        function retry() { window.location.replace(APP_URL); }
        document.getElementById('retry').addEventListener('click', retry);
        window.addEventListener('online', retry);
      })();
    </script>
  </body>
</html>
